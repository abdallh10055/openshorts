name: OpenShorts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  openshorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Build and run
        run: |
          docker build -t openshorts .
          docker run -d --name openshorts -p 8000:8000 -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} openshorts
          sleep 20
          curl -s http://localhost:8000/health/ready
      
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo -S -p '' dpkg -i cloudflared.deb
      
      - name: Start tunnel
        run: |
          cloudflared tunnel --url http://localhost:8000 > tunnel_url.log 2>&1 &
          sleep 15
          cat tunnel_url.log
      
      - name: Get URL
        run: |
          TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel_url.log | head -1)
          echo "OPENSHORTS_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "URL: $TUNNEL_URL"
        id: tunnel
      
      - name: Keep alive
        run: |
          while docker ps | grep -q openshorts; do
            sleep 60
          done
